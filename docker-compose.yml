services:
  postgres:
    image: postgres:17
    container_name: certiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow123
      POSTGRES_DB: certiflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: certiflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: